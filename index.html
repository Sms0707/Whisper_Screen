<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisper Screen | Zero-Latency AI Narration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="overlay-panel">
    <!-- Top Toolbar (Draggable) -->
    <div class="top-toolbar">
      <button class="btn-primary" id="startBtn">Start AI</button>
      <button class="btn-ghost" id="stopBtn" disabled>Stop</button>
      
      <div class="settings-group">
        <div class="field">
          <label>Noise Gate</label>
          <input type="range" id="threshSlider" min="10" max="60" step="2" value="24">
        </div>
        <div class="field">
          <label>Trigger Pause</label>
          <input type="range" id="pauseSlider" min="0.5" max="4.0" step="0.5" value="1.0">
        </div>
      </div>
      
      <label class="toggle-field" style="cursor: pointer;">
        <input type="checkbox" id="muteToggle"> Mute Voice
      </label>
      
      <div class="badges">
      <!-- The classic 'X' Close Button (Pinned to Top Right) -->
      <button class="btn-ghost" id="closeBtn" title="Close Whisper Screen" style="position: absolute; right: 20px; top: 20px; padding: 6px; border-color: transparent; color: #94A3B8; -webkit-app-region: no-drag; z-index: 100;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
        <div class="badge" id="speechBadge"><span class="dot"></span><span id="speechState">Idle</span></div>
      </div>
    </div>

    <!-- Status & Transcriptions -->
    <div class="status" id="status">Waiting for Google Meet...</div>
    <div id="log" class="log-container"></div>
    
    <!-- Hidden Elements required for the engine to run -->
    <div style="display: none;">
      <button id="testVoiceBtn">Hidden Test</button>
      <span id="threshVal"></span><span id="pauseVal"></span>
      <div id="previewWrap"><video id="hiddenVideo" autoplay muted playsinline></video></div>
      <canvas id="hiddenCanvas"></canvas>
      <canvas id="motionCanvas" width="64" height="64"></canvas>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
